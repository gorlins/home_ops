kind: Namespace
apiVersion: v1
metadata:
  name: metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app metallb
spec:
  interval: 1h
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: *app

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
spec:
  interval: 60m
  url: https://metallb.github.io/metallb
