---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    cluster:
      name: k3s-ansible
    k8sServiceHost: 10.10.10.88  # The cluster VIP
    k8sServicePort: 6443
    kubeProxyReplacement: true
    ipam:
      mode: kubernetes # recommended for k3s compatibility
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16

    # Simplify routing on a single L2 - these values together
    autoDirectNodeRoutes: true
    routingMode: native

    bpf:
      masquerade: true
    gatewayAPI:
      enabled: true
    l2announcements:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.20.2
  url: oci://quay.io/cilium/charts/cilium
