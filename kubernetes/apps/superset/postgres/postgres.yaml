apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: superset-database
spec:
  instances: 3

  storage:
    size: 1Gi
    storageClass: local-path

  bootstrap:
    initdb:
      dataChecksums: true
      # TODO: Use managed extensions (pg 18)

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze-store
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: superset-database-backup
spec:
  cluster:
    name: superset-database
  schedule: '0 0 0 * * *'
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
