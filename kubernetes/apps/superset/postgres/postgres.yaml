apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: superset-database
spec:
  instances: 3

  storage:
    size: 1Gi
    storageClass: local-path

  bootstrap:
    initdb:
      dataChecksums: true
      # TODO: Use managed extensions (pg 18)

  backup:
    barmanObjectStore:
      destinationPath: "s3://scottgorlin-k8s-backup/cnpg"
      endpointURL: "https://s3.us-west-000.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: backblaze-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backblaze-credentials
          key: ACCESS_SECRET_KEY
    retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: superset-database-backup
spec:
  cluster:
    name: immich-database
  schedule: '0 0 0 * * *'
  backupOwnerReference: self
