---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-runner
spec:
  serviceName: gitea-runner
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: act-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/component: act-runner
    spec:
      # Optional: pin to a dedicated node, e.g.
      # nodeSelector:
      #   kubernetes.io/hostname: talos-w1
      enableServiceLinks: false
      terminationGracePeriodSeconds: 240
      initContainers:
        # Native sidecar (restartPolicy: Always): starts before the runner and
        # must pass its startupProbe first, so the daemon is ready at registration.
        - name: dind
          image: docker.io/library/docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
          restartPolicy: Always
          args:
            # Listen only on a unix socket shared via emptyDir -- no TCP port,
            # so nothing else in the cluster can reach this (root-equivalent) daemon.
            - --host=unix:///var/run/dind/docker.sock
            # Cilium runs in native routing mode, so pod MTU == node MTU (1500) and
            # docker's default matches. If you ever switch to tunnel mode, set both
            # of these to the pod MTU (e.g. 1450):
            # - --mtu=1450
            # - --default-network-opt=bridge=com.docker.network.driver.mtu=1450
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command: ["docker", "--host=unix:///var/run/dind/docker.sock", "info"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: dind-sock
              mountPath: /var/run/dind
            - name: docker-data
              mountPath: /var/lib/docker
      containers:
        - name: runner
          image: docker.io/gitea/act_runner:0.6.1@sha256:b5c35d6bdbb9bb25e531230bfc7cc663cb751406cbec90a2a891b85fea54de86
          env:
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Read from a file (not an env var) and only used on first registration.
            - name: GITEA_RUNNER_REGISTRATION_TOKEN_FILE
              value: /secrets/token
            - name: DOCKER_HOST
              value: unix:///var/run/dind/docker.sock
          ports:
            - name: metrics
              containerPort: 9101
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: token
              mountPath: /secrets
              readOnly: true
            - name: dind-sock
              mountPath: /var/run/dind
      volumes:
        - name: config
          configMap:
            name: gitea-runner-config
        - name: token
          secret:
            secretName: gitea-runner-token
        - name: dind-sock
          emptyDir: {}
        # Docker image/layer cache. Ephemeral (node's /var) on purpose: heavy
        # build I/O stays local and the cache survives everything but pod
        # rescheduling. Swap for a Longhorn volumeClaimTemplate if you want it
        # to persist across reschedules.
        - name: docker-data
          emptyDir:
            sizeLimit: 50Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
